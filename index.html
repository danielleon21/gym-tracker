<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">GT</span>
      <h1>Gym Tracker</h1>
    </div>
    <nav class="tabs">
      <button class="tab is-active" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="routines">Rutinas</button>
      <button class="tab" data-view="workout">Entrenar</button>
      <button class="tab" data-view="history">Histórico</button>
    </nav>
    <div class="data-actions">
      <button class="btn btn-sm" id="export-data" title="Descargar una copia de tus datos">Exportar</button>
      <button class="btn btn-sm" id="import-data" title="Restaurar desde un archivo">Importar</button>
      <input type="file" id="import-file" accept="application/json" hidden>
    </div>
  </header>

  <main class="container">
    <!-- ============ DASHBOARD ============ -->
    <section class="view is-active" id="view-dashboard">
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Sesiones este mes</span>
          <strong class="stat-value" id="stat-month">0</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">Racha actual</span>
          <strong class="stat-value" id="stat-streak">0 <small>días</small></strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">Volumen del mes</span>
          <strong class="stat-value" id="stat-volume">0 <small>kg</small></strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">Total de sesiones</span>
          <strong class="stat-value" id="stat-total">0</strong>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Heatmap de entrenamientos</h2>
          <div class="year-nav">
            <button class="btn btn-icon" id="year-prev" aria-label="Año anterior">‹</button>
            <span id="year-label">2026</span>
            <button class="btn btn-icon" id="year-next" aria-label="Año siguiente">›</button>
          </div>
        </div>
        <div id="heatmap" class="heatmap"></div>
        <div class="heatmap-legend">
          <span>Menos</span>
          <i class="lvl lvl-0"></i><i class="lvl lvl-1"></i><i class="lvl lvl-2"></i><i class="lvl lvl-3"></i><i class="lvl lvl-4"></i>
          <span>Más volumen</span>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Últimas sesiones</h2></div>
        <div id="recent-sessions" class="list"></div>
      </div>
    </section>

    <!-- ============ RUTINAS ============ -->
    <section class="view" id="view-routines">
      <div class="view-head">
        <h2>Mis rutinas</h2>
        <button class="btn btn-primary" id="new-routine">+ Nueva rutina</button>
      </div>
      <div id="routines-list" class="cards-grid"></div>
    </section>

    <!-- ============ ENTRENAR ============ -->
    <section class="view" id="view-workout">
      <div id="workout-container"></div>
    </section>

    <!-- ============ HISTÓRICO ============ -->
    <section class="view" id="view-history">
      <div class="card">
        <div class="card-head">
          <h2>Progreso por ejercicio</h2>
          <select id="exercise-filter" class="input"></select>
        </div>
        <div id="exercise-progress"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Historial de sesiones</h2></div>
        <div id="history-list" class="list"></div>
      </div>
    </section>
  </main>

  <!-- Modal genérico -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">Título</h3>
        <button class="btn btn-icon" id="modal-close" aria-label="Cerrar">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/routines.js"></script>
  <script src="js/workout.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
